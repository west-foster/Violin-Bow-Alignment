[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bowtrack"
version = "0.1.0"
description = "Real-time violin bow-angle tracking with PyTorch keypoints and monocular 3D geometry"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "PySide6>=6.6",
    "pyqtgraph>=0.13.4",
    "PyOpenGL>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
bowtrack = "bowtrack.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
