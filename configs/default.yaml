# bowtrack default configuration.
# All lengths are in millimetres. Measure your own violin/bow and override these
# for best 3D accuracy (a few mm of error here only shifts the angle slightly).

camera:
  index: 0               # OpenCV camera index (0 = built-in webcam)
  width: 1280
  height: 720
  fps: 30
  # Used only if no calibration file exists. MacBook webcams are roughly 65-75 deg.
  horizontal_fov_deg: 70.0
  # Written by scripts/calibrate_camera.py (checkerboard calibration).
  calibration_file: configs/camera_calibration.yaml

# Violin coordinate frame (right-handed):
#   origin = centre of the bridge at string height
#   +x     = along the strings toward the scroll
#   +y     = across the strings toward the bass (G) side
#   +z     = out of the top plate (toward the player's face)
# Approximate full-size (4/4) violin. Keypoints the model can see are matched
# against these with solvePnP to get the violin's 6-DoF pose.
violin_model:
  scroll:        [430.0,   0.0, -15.0]
  nut:           [325.0,   0.0,   0.0]
  bridge_bass:   [  0.0,  17.0,  -3.0]
  bridge_treble: [  0.0, -17.0,  -3.0]
  # Tailpiece: centred on every violin (unlike the chin rest, whose position
  # varies and is usually under the jaw). x of the top edge = "afterlength"
  # (bridge to tailpiece), normally ~1/6 of the string length.
  tailpiece_top: [-55.0,   0.0, -15.0]
  tailpiece_end: [-155.0,  0.0, -50.0]
  # Body corners (tips of the purfling at the C-bouts), on the top plate's
  # edge. These give the pose its tilt/roll: the bridge alone is only 34 mm
  # wide. x = distance from the bridge along the centre line (+ toward the
  # neck), y = half the width across the pair of corners (the corners stick
  # out: ~150 / ~170 mm across), z = how far the edge sits below the string
  # line (the strings are ~48 mm above the edge at the bridge, less toward the
  # neck because of the neck angle).
  corner_upper_bass:   [ 70.0,  75.0, -41.0]
  corner_upper_treble: [ 70.0, -75.0, -41.0]
  corner_lower_bass:   [-15.0,  84.0, -49.0]
  corner_lower_treble: [-15.0, -84.0, -49.0]
  string_length: 325.0   # nut -> bridge, defines the string axis

# Optional ruler measurements of YOUR violin (mm). Any value filled in here is
# held nearly fixed by scripts/fit_violin_model.py; the rest is learned from
# your labelled frames. Distances along the strings are from the bridge
# (+ toward the neck); heights are measured DOWN from the string plane, so they
# are negative (e.g. strings ~33 mm above the top at the bridge -> bridge foot -33).
violin_measurements:
  upper_corner_x: null           # bridge -> line through the two upper corners
  upper_corner_half_width: null  # half the distance between the two upper corners
  upper_corner_z: null           # -(height of the strings above the upper corners)
  lower_corner_x: null           # bridge -> line through the two lower corners (negative)
  lower_corner_half_width: null
  lower_corner_z: null
  tailpiece_top_x: null          # bridge -> tailpiece top edge (negative, ~-55)
  tailpiece_end_x: null          # bridge -> tailpiece bottom end (negative)
  scroll_x: null                 # bridge -> outermost point of the scroll

bow:
  # Distance between the frog and tip keypoints (where the hair meets the
  # frog ferrule and the tip). ~650 mm for a full-size bow.
  hair_length: 650.0

feedback:
  target_angle_deg: 90.0
  tolerance_deg: 5.0
  smoothing_window: 5     # median filter over this many frames
  min_confidence: 0.35    # keypoint heatmap peak needed to count as visible

model:
  backbone: resnet50      # teacher; students: resnet18, mobilenet_v3_large
  input_height: 256
  input_width: 448
  heatmap_sigma: 2.0
  checkpoint: checkpoints/teacher_resnet50.pt
